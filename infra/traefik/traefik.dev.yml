# Local development Traefik static config.
# Plain HTTP on port 80 for *.localhost deployed apps (no ACME).

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: spring-lane
